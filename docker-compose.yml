services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./app/public:/var/www/app/public:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - payflow-net

  php:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./app:/var/www/app:delegated
    environment:
      APP_ENV: ${APP_ENV:-production}
      PUBLIC_SCHEME: ${PUBLIC_SCHEME:-}
      DB_HOST: mysql
      DB_NAME: ${DB_NAME:-payflow_core}
      DB_USER: ${DB_USER:-payflow_app}
      DB_PASS: ${DB_PASS:-changeme_app_db}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - payflow-net

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-payflow_core}
      MYSQL_USER: ${DB_USER:-payflow_app}
      MYSQL_PASSWORD: ${DB_PASS:-changeme_app_db}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme_root}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - payflow-net

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - payflow-net

networks:
  payflow-net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
