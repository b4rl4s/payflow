upstream php-payflow {
    server php:9000;
}

# Marketing / corporate apex
server {
    listen 80;
    server_name payflow.local www.payflow.local;

    root /var/www/app/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_pass php-payflow;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|woff2?|svg|webp)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

# Application shell — primary SPA-like entry for customers
server {
    listen 80;
    server_name app.payflow.local;

    root /var/www/app/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_pass php-payflow;
    }

    location ~* \.(js|css|map)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }
}

